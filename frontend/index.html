<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LawLens AI</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #6c757d;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #1a2530;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            background-color: #0b2567;
            color: white;
            padding: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #081b4d;
        }
        .toggle-btn {
            margin-top: 15px;
            color: #0056b3;
            cursor: pointer;
            text-decoration: underline;
            display: inline-block;
        }
        .error-msg {
            color: #d9534f;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
        .success-msg {
            color: #5cb85c;
            font-size: 14px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2 id="form-title">Login to LawLens</h2>
    
    <input type="text" id="username" placeholder="Username" required>
    <input type="email" id="email" placeholder="Email (For Register only)" style="display: none;">
    <input type="password" id="password" placeholder="Password" required>

    <button id="submit-btn" onclick="handleSubmit()">Login</button>

    <div id="msg-box" class="error-msg"></div>

    <div class="toggle-btn" id="toggle-link" onclick="toggleMode()">
        Need an account? Register
    </div>
</div>

<script>
    const API_BASE = "https://lawlens-ai.onrender.com";
    let isRegister = false;

    function toggleMode() {
        isRegister = !isRegister;
        document.getElementById("form-title").innerText = isRegister ? "Register for LawLens" : "Login to LawLens";
        document.getElementById("submit-btn").innerText = isRegister ? "Register" : "Login";
        document.getElementById("email").style.display = isRegister ? "block" : "none";
        document.getElementById("toggle-link").innerText = isRegister ? "Already have an account? Login" : "Need an account? Register";
        hideMsg();
    }

    function showMsg(msg, isError = true) {
        const box = document.getElementById("msg-box");
        box.innerText = msg;
        box.className = isError ? "error-msg" : "success-msg";
        box.style.display = "block";
    }

    function hideMsg() {
        document.getElementById("msg-box").style.display = "none";
    }

    async function handleSubmit() {
        hideMsg();
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        const email = document.getElementById("email").value.trim();

        if (!username || !password) {
            showMsg("Please enter username and password.");
            return;
        }

        const endpoint = isRegister ? "/register" : "/login";
        const payload = { username, password, email: email || null };

        try {
            const response = await fetch(`${API_BASE}${endpoint}`, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                showMsg(data.detail || "Server error.");
            } else {
                showMsg(data.message || (isRegister ? "Registered successfully!" : "Logged in!"), false);
                if (isRegister) {
                    setTimeout(() => toggleMode(), 1200);
                }
            }
        } catch (err) {
            console.error(err);
            showMsg("Could not connect to server. Open backend link first to wake it up.");
        }
    }
</script>

</body>
</html>
